<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./syle.css" />
    <title>html-and-css-sign-up-form</title>
  </head>
  <body>
    <main>
      <aside class="aside">
        <div class="odinLogo">
          <img src="./public/images/odin-lined.png" />
          <h1>odin</h1>
        </div>
      </aside>
      <div class="mainContent">
        <article class="formHeading">
          <p>
            This is not a real online sevice! You know you need something like
            this in your life to help you realize your deepest dreams.
            <br />Sign up
            <em>now</em>
            to get started.
          </p>
          <p>You <em>know</em> you want to.</p>
        </article>
        <div class="formContainer">
          <h2>Let's do this!</h2>
          <form action="#">
            <div class="inputsContaner">
              <div>
                <label for="first name"> first name </label>
                <input type="text" name="first name" id="first name" required />
              </div>
              <div>
                <label for="last name"> last name </label>
                <input type="text" name="last name" id="last name" required />
              </div>
              <div>
                <label for="email"> email </label>
                <input
                  type="email"
                  name="email"
                  id="email"
                  autocomplete="true"
                  required
                />
              </div>
              <div>
                <label for="phone number"> phone number </label>
                <input
                  type="phone"
                  name="phone number"
                  id="phone number"
                  autocomplete="true"
                  required
                />
              </div>
              <div>
                <label for="password"> password </label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  autocomplete="true"
                  required
                />
              </div>
              <div>
                <label for="confirm password"> confirm password </label>
                <input
                  type="password"
                  name="confirm password"
                  id="confirm password"
                  autocomplete="true"
                  required
                />
              </div>
            </div>
            <button type="submit">create account</button>
          </form>
        </div>
        <p class="login">
          Alredy have an account? <span><a href="#">Log in</a></span>
        </p>
      </div>
    </main>
  </body>
</html>
